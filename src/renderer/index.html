<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; connect-src 'self'">
<title>My Postmaster</title>
<link rel="icon" type="image/png" href="/assets/icons/32.png">
<link rel="stylesheet" href="/node_modules/monaco-editor/min/vs/editor/editor.main.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/bricolage-grotesque/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/700.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/assets/icons/64.png" alt="" title="My Postmaster"><span class="bt">My Postmaster</span></div>
  <button id="btnNew" class="pillbtn" title="New (Ctrl+N)"></button>
  <button id="btnImport" class="pillbtn" title="Import (Ctrl+O)"></button>
  <span class="sp"></span>
  <div class="searchbox" id="searchbox" role="button" tabindex="0" title="Search (Ctrl+K)"></div>
  <span class="sp"></span>
  <div class="themeseg" id="themeSeg" role="radiogroup" aria-label="Theme"></div>
  <button class="ghost" id="btnSettings" title="Settings (Ctrl+,)"></button>
  <button class="ghost" id="btnAi" title="Claude AI assistant"></button>
  <div class="winctl" id="winctl"><button data-w="min" title="Minimize" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.4"/></svg></button><button data-w="max" title="Maximize" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button><button data-w="close" class="close" title="Close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
</header>
<div class="main" id="main">
  <aside class="side" id="side">
    <div class="side-head"><nav class="rail" id="rail" aria-label="Sidebar sections"></nav><span id="sideTitle" hidden></span></div>
    <div class="side-filter"><input id="filter" placeholder="Filter by name or path" title="Filter (Ctrl+F)" aria-label="Filter sidebar"><button class="iconbtn" id="sideAdd"></button><button class="iconbtn" id="sideMore"></button></div>
    <div class="tree" id="tree" tabindex="0" role="tree"></div>
    <div class="envdock" id="envDock"></div>
  </aside>
  <div class="resizer" id="sideResizer"></div>
  <section class="center">
    <div class="deskbar"><div class="tabs" id="tabs" role="tablist"></div></div>
    <div class="view" id="view"></div>
  </section>
  <aside class="ai" id="ai"></aside>
</div>
<div class="console" id="console"></div>
<footer class="status" id="status"></footer>
<div class="findbar" id="findbar"><input id="findInput" placeholder="Find in page" style="width:220px"><span id="findCount" class="dim"></span><button class="ghost" id="findPrev">↑</button><button class="ghost" id="findNext">↓</button><button class="ghost" id="findClose">✕</button></div>
<div class="toast-wrap" id="toasts"></div>
<script src="/node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="dynamic.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
